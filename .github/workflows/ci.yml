name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (make ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: make ci (gofmt check, test, test -race, vet)
        run: make ci

  adapter:
    name: gunnflow-adapter (tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gunnflow-adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gunnflow-adapter/package-lock.json
      - run: npm ci
      - run: npm test
